<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f8e7" />
  <meta name="description" content="Menú completo y pedidos online de OKI." />
  <title>OKI — Pedidos online</title>
  <link rel="icon" href="./public/favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <header class="site-header">
      <div class="header-row">
        <a class="brand" href="#menu" aria-label="OKI, ir al menú"><span>おき</span>OKI</a>
        <p class="slogan">TU PAUSA FAVORITA</p>
        <button class="icon-button" id="header-cart" aria-label="Abrir carrito">▣<b class="cart-count">0</b></button>
      </div>
      <button class="location-card" type="button"><span class="location-icon">⌖</span><span><small>Tu pedido en</small><strong id="order-location">OKI · Recoger en tienda</strong></span><i>⌄</i></button>
    </header>

    <section class="hero-wrap">
      <div class="hero">
        <div class="hero-copy"><small>ALL DAY, OKI</small><h1>Tu pausa<br />favorita.</h1><a href="#menu">Ver el menú <span>→</span></a></div>
        <div class="hero-visual" aria-label="Smoothies OKI">
          <img class="hero-smoothie" src="./images/smoothie-mornings.png" alt="Smoothie Mornings de maracuyá y mango" fetchpriority="high" />
          <img class="hero-smoothie" src="./images/smoothie-oki.png" alt="Smoothie Oki de matcha, banano y aguacate" />
          <img class="hero-smoothie" src="./images/smoothie-berries.png" alt="Smoothie Berries lover de frutos rojos" />
          <img class="hero-smoothie" src="./images/smoothie-choco.png" alt="Smoothie Choco banana con cacao" />
        </div>
      </div>
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="¿Qué se te antoja hoy?" autocomplete="off" /><button id="clear-search" type="button" aria-label="Limpiar búsqueda" hidden>×</button></label>
    </section>

    <section class="menu" id="menu">
      <div class="section-head"><div><small>MENÚ COMPLETO</small><h2>Elige tu favorito</h2></div><span class="open"><i></i>Abierto hoy</span></div>
      <div class="categories" id="categories" role="tablist" aria-label="Categorías del menú"></div>
      <div class="product-grid" id="products" aria-live="polite"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <a href="#menu" class="active"><span>⌂</span>Inicio</a>
    <a href="#menu"><span>▦</span>Menú</a>
    <button id="nav-cart" type="button"><i>▣<b class="cart-count">0</b></i>Pedido</button>
    <button id="favorites" type="button"><span>♡</span>Favoritos</button>
    <button id="profile" type="button"><span>◎</span>Perfil</button>
  </nav>

  <div class="overlay" id="product-overlay" hidden>
    <section class="sheet product-sheet" role="dialog" aria-modal="true" aria-labelledby="product-title">
      <div class="grabber"></div><button class="sheet-close" data-close="product" aria-label="Cerrar">×</button>
      <div id="product-detail"></div>
    </section>
  </div>

  <div class="overlay" id="cart-overlay" hidden>
    <section class="sheet cart-sheet" role="dialog" aria-modal="true" aria-labelledby="cart-title">
      <div class="grabber"></div>
      <header class="sheet-header"><button id="cart-back" aria-label="Volver">×</button><div><small id="cart-kicker">TU PEDIDO</small><h2 id="cart-title">Tu pedido</h2></div><span></span></header>
      <div id="cart-content" class="sheet-scroll"></div>
      <div id="cart-action" class="sticky-action"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden><strong id="toast-title"></strong><span id="toast-copy"></span></div>
  <script src="./app.js" defer></script>
</body>
</html>
